name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          install-only: true
      - name: Check formatting, modules, and lint
        run: make fmt-check mod-check lint

  test-minimum:
    name: Test (minimum Go)
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up minimum Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache-dependency-path: go.sum
      - name: Run tests
        run: make test

  test-current:
    name: Test and coverage (current Go)
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up current Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Run tests with coverage floor
        run: make coverage

  examples:
    name: Examples
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Compile examples
        run: |
          mkdir -p "${RUNNER_TEMP}/sonnetbox-examples"
          go build -o "${RUNNER_TEMP}/sonnetbox-examples/hello" ./examples/hello
          go build -o "${RUNNER_TEMP}/sonnetbox-examples/config-renderer" ./examples/config-renderer
          go build -o "${RUNNER_TEMP}/sonnetbox-examples/http-service" ./examples/http-service
      - name: Run command examples
        run: |
          set -euo pipefail

          hello_output="$("${RUNNER_TEMP}/sonnetbox-examples/hello")"
          grep -F '"message": "Hello, sonnetbox!"' <<<"${hello_output}"
          grep -F '"sandboxed": true' <<<"${hello_output}"

          config_output="$("${RUNNER_TEMP}/sonnetbox-examples/config-renderer" \
            -workspace ./examples/config-renderer/jsonnet \
            -environment production)"
          grep -F '"environment": "production"' <<<"${config_output}"
          grep -F '"replicas": 3' <<<"${config_output}"
      - name: Run HTTP service example
        run: |
          set -euo pipefail

          service_log="${RUNNER_TEMP}/sonnetbox-http-service.log"
          "${RUNNER_TEMP}/sonnetbox-examples/http-service" \
            -addr 127.0.0.1:18080 >"${service_log}" 2>&1 &
          service_pid=$!
          cleanup() {
            kill -TERM "${service_pid}" 2>/dev/null || true
            wait "${service_pid}" 2>/dev/null || true
            cat "${service_log}"
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:18080/render; then
              ready=true
              break
            fi
            if ! kill -0 "${service_pid}" 2>/dev/null; then
              echo "HTTP service exited before becoming ready"
              exit 1
            fi
            sleep 1
          done
          if [[ "${ready}" != true ]]; then
            echo "HTTP service did not become ready"
            exit 1
          fi

          response="$(curl --silent --show-error --fail-with-body \
            --max-time 30 \
            --header 'Content-Type: application/json' \
            --data-binary '{"customer":"ci","source":"local catalog = import \"../lib/catalog.libsonnet\"; { customer: std.extVar(\"customer\"), product: catalog(\"starter\") }"}' \
            http://127.0.0.1:18080/render)"
          grep -F '"customer":"ci"' <<<"${response}"
          grep -F '"name":"Starter"' <<<"${response}"

  race:
    name: Race
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Run race detector
        run: make race

  wasm-portability:
    name: Wasm and portability
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Check Cgo-free build and embedded Wasm
        run: make no-cgo wasm-check

  container:
    name: Container
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Go version
        id: go-version
        run: echo "version=$(tr -d '[:space:]' < .go-version)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: sonnetbox:ci
          build-args: |
            GO_VERSION=${{ steps.go-version.outputs.version }}
            VERSION=ci
          provenance: false
          sbom: false
      - name: Smoke-test image
        run: docker run --rm sonnetbox:ci --help

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Run fuzz smoke tests
        run: make fuzz-smoke

  vulnerability:
    name: Vulnerability scan
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: .go-version
          go-package: ./...
          output-format: text

  workflow-security:
    name: Workflow security
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: false
          annotations: true
          collect: all
          persona: pedantic
          version: v1.27.0
